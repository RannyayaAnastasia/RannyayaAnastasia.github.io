services:
  - type: web
    name: rannyaya-club
    runtime: python
    plan: free
    region: frankfurt
    rootDir: club
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 app:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rannyaya-club-db
          property: connectionString

databases:
  - name: rannyaya-club-db
    plan: free
    region: frankfurt
    ipAllowList: []
